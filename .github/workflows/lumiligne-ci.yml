name: Lumiligne CI

# Tests de la logique de Lumiligne (LumiCore) et build de l'app iOS, seulement quand le dossier lumiligne/ change.
on:
  push:
    branches: [main, "claude/**"]
    paths: ["lumiligne/**", ".github/workflows/lumiligne-*.yml"]
  pull_request:
    paths: ["lumiligne/**", ".github/workflows/lumiligne-*.yml"]
  workflow_dispatch:

concurrency:
  group: lumiligne-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lumiligne:
    name: Lumiligne (tests + build iOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode le plus récent
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Tests de la logique (LumiCore)
        run: swift test --package-path lumiligne/Packages/LumiCore 2>&1 | grep -vE "^\[[0-9]+/[0-9]+\] (Compiling|Write|Emitting)" | tail -80; exit ${PIPESTATUS[0]}
      - name: XcodeGen
        run: |
          brew install xcodegen
          cd lumiligne && xcodegen generate
      - name: Build de l'app (simulateur, sans signature)
        run: |
          status=0
          xcodebuild build \
            -project lumiligne/Lumiligne.xcodeproj \
            -scheme Lumiligne \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || status=$?
          grep -E "error:|warning: .*Lumiligne/|BUILD (SUCCEEDED|FAILED)" build.log | sort -u | tail -80
          exit $status
      - name: Journal de build
        if: failure()
        run: |
          grep -E "error:" -A3 build.log | head -150 || true
          grep -E "error:" build.log | sort -u | head -30 | sed 's/^/::error::/' || true
