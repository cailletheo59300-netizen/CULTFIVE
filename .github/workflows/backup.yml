name: Sauvegarde de la base

# Copie complète de la base Brainlix (schémas public et auth) chaque nuit, chiffrée (AES-256), gardée 30 jours
# comme fichier de la tâche GitHub. Restauration : docs/BACKUP.md.
# Secrets du dépôt (Settings → Secrets and variables → Actions), jamais dans le code :
#   SUPABASE_DB_URL    chaîne de connexion « Session pooler » de Supabase (avec le mot de passe de la base)
#   BACKUP_PASSPHRASE  phrase de chiffrement (à garder aussi hors de GitHub : sans elle, la sauvegarde est illisible)
on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    name: Copie chiffrée de la base
    runs-on: ubuntu-latest
    steps:
      - name: Secrets présents
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          missing=""
          [ -n "$SUPABASE_DB_URL" ] || missing="$missing SUPABASE_DB_URL"
          [ -n "$BACKUP_PASSPHRASE" ] || missing="$missing BACKUP_PASSPHRASE"
          if [ -n "$missing" ]; then echo "::error::Secrets manquants :$missing (voir docs/BACKUP.md)"; exit 1; fi

      - name: Copie (pg_dump 17, comme le serveur)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e SUPABASE_DB_URL -v "$PWD:/out" postgres:17 \
            pg_dump "$SUPABASE_DB_URL" --format=custom --no-owner --no-privileges \
              --schema=public --schema=auth -f /out/brainlix.dump
          ls -lh brainlix.dump

      - name: Chiffrement
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          name="brainlix-$(date -u +%Y-%m-%d).dump.gpg"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 -o "$name" brainlix.dump
          shred -u brainlix.dump
          echo "NAME=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}
          retention-days: 30
          if-no-files-found: error
