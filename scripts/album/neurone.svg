    <use href="#tige" fill="#fff" stroke="#fff" stroke-width="22"/>
    <use href="#corps" fill="#fff" stroke="#fff" stroke-width="22"/>
    <use href="#tige" fill="#C9B8FF" stroke="#1A1830" stroke-width="7"/>
    <use href="#corps" fill="url(#peau)" stroke="#1A1830" stroke-width="7"/>
