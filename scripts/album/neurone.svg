    <path id="corps" d="M40,120 C22,118 18,96 30,86 C22,70 34,52 52,54 C56,36 80,30 94,40 C104,26 130,28 138,42 C156,38 176,52 172,70 C188,78 186,104 170,110 C174,126 160,138 146,134 C140,146 122,150 112,140 L104,140 C100,152 88,156 80,148 C66,154 50,146 52,134 C42,134 36,128 40,120 Z"/>
    <path id="tige" d="M98,136 C100,152 104,162 112,172 L128,166 C120,156 118,146 120,134 Z"/>
  </defs>
  <g stroke-linejoin="round" stroke-linecap="round">
