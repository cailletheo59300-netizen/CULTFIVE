<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="256" height="256">
  <!-- Le neurone, monnaie de l'album : un cerveau dessiné façon autocollant (contour encre, aplats doux). -->
  <defs>
    <linearGradient id="peau" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB8D2"/><stop offset=".6" stop-color="#FF97BE"/><stop offset="1" stop-color="#F277A8"/>
