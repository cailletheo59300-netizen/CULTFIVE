      <path d="M150,56 C150,66 160,72 170,72"/>
      <path d="M68,124 C76,116 88,124 96,116"/>
      <path d="M116,118 C126,112 134,120 146,112 C154,107 160,110 166,104"/>
      <path d="M136,138 C142,130 152,130 158,134"/>
    </g>
    <!-- reflets -->
    <ellipse cx="74" cy="60" rx="13" ry="6" fill="#fff" opacity=".8" transform="rotate(-24 74 60)"/>
    <circle cx="94" cy="54" r="3.2" fill="#fff" opacity=".8"/>
    <!-- étincelle -->
    <path d="M178,26 Q180,38 192,40 Q180,42 178,54 Q176,42 164,40 Q176,38 178,26 Z" fill="#FFD23F" stroke="#1A1830" stroke-width="3"/>
