<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Icônes Brainlix</title></head>
<body>
<!-- Fabrique les icônes 3D de l'app (coffres, graines, flamme, joker, tickets, arrosoir) à partir des modèles validés
     (maquettes « coffre 3D » et « objets 3D »). Lancé par scripts/icons/render.mjs, qui écrit les PNG dans Assets.xcassets. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---------- moteur 3D hors écran : chaque icône est rendue une fois en image ----------
const R=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});R.setPixelRatio(1);
R.outputEncoding=THREE.sRGBEncoding;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.25;
const scene=new THREE.Scene();
const pm=new THREE.PMREMGenerator(R);const env=new THREE.Scene();env.background=new THREE.Color(0x2a2833);
[[6,3,0,6,2,0xffffff],[4,6,-6,2,3,0xfff1c9],[4,6,6,2,-2,0xd7dbe6],[8,2,0,-3,5,0x55506a]].forEach(([w,h,x,y,z,c])=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:c,side:THREE.DoubleSide}));m.position.set(x,y,z);m.lookAt(0,0,0);env.add(m);});
scene.environment=pm.fromScene(env,.04).texture;
scene.add(new THREE.HemisphereLight(0xffffff,0x4a4458,.55));
const key=new THREE.DirectionalLight(0xfff3dc,2.3);key.position.set(3,6,4);scene.add(key);
const rim=new THREE.DirectionalLight(0xfff1e0,.9);rim.position.set(-4,3,-4);scene.add(rim);
const cam=new THREE.PerspectiveCamera(30,1,.1,50);
const holder=new THREE.Group();scene.add(holder);

const phys=(color,o)=>{o=Object.assign({},o||{});delete o.clearcoat;return new THREE.MeshStandardMaterial(Object.assign({color,roughness:.32,metalness:0,envMapIntensity:.8},o));};
const metal=(color,rough)=>new THREE.MeshStandardMaterial({color,roughness:rough??.2,metalness:1,envMapIntensity:1.5});
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t;}
function extrude(shape,depth,bevel){const g=new THREE.ExtrudeGeometry(shape,{depth,bevelEnabled:true,bevelThickness:bevel,bevelSize:bevel,bevelSegments:5,curveSegments:24});g.translate(0,0,-depth/2);return g;}
function rbox(w,h,d,r){r=Math.min(r,w/2-.001,h/2-.001);const s=new THREE.Shape();
  s.moveTo(-w/2,-h/2+r);s.lineTo(-w/2,h/2-r);s.quadraticCurveTo(-w/2,h/2,-w/2+r,h/2);s.lineTo(w/2-r,h/2);s.quadraticCurveTo(w/2,h/2,w/2,h/2-r);s.lineTo(w/2,-h/2+r);s.quadraticCurveTo(w/2,-h/2,w/2-r,-h/2);s.lineTo(-w/2+r,-h/2);s.quadraticCurveTo(-w/2,-h/2,-w/2,-h/2+r);
  const b=Math.min(r,d/4);const g=new THREE.ExtrudeGeometry(s,{depth:Math.max(d-2*b,.001),bevelEnabled:true,bevelThickness:b,bevelSize:b*.9,bevelSegments:4,curveSegments:8});g.translate(0,0,-(d-2*b)/2);return g;}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function woodTex(base,dark,light,painted){return canvasTex(512,512,(g,w,h)=>{g.fillStyle=base;g.fillRect(0,0,w,h);const rnd=mulberry(7);
  for(let p=0;p<4;p++){const y0=p*128;for(let i=0;i<(painted?10:26);i++){g.strokeStyle=(rnd()>.5?dark:light);g.globalAlpha=painted?.12:.22+rnd()*.2;g.lineWidth=1+rnd()*2.5;g.beginPath();const yy=y0+8+rnd()*112;for(let x=0;x<=w;x+=16)g.lineTo(x,yy+Math.sin(x/40+i)*3+Math.sin(x/9)*.8);g.stroke();}
  if(!painted&&rnd()>.3){g.globalAlpha=.45;g.fillStyle=dark;g.beginPath();g.ellipse(80+rnd()*350,y0+64,12,6,0,0,Math.PI*2);g.fill();}
  g.globalAlpha=.7;g.fillStyle=dark;g.fillRect(0,y0,w,5);g.globalAlpha=.35;g.fillStyle=light;g.fillRect(0,y0+5,w,3);}g.globalAlpha=1;});}

const TIERS={
  wood:{wood:['#B2733A','#5E3818','#E0A56A',false],metal:0x6b737c,metalRough:.4,lock:0xC9CED4,gem:null},
  silver:{wood:['#5C7FB8','#2E4677','#9DB7E3',true],metal:0xe4eaf2,metalRough:.18,lock:0xf2f5f9,gem:0x4dabf7},
  gold:{wood:['#C2361F','#7A1A0E','#F0745B',true],metal:0xffc933,metalRough:.2,lock:0xffe27a,gem:0xff4d5e},
  savant:{wood:['#4B2BC9','#24127A','#8E73FF',true],metal:0xffc933,metalRough:.16,lock:0xffe27a,gem:0xffd23f},
};
// k : ouverture, de 0 (fermé) à 1 (couvercle basculé, lueur pleine) ; true = 1.
function chest(tier,k){
  k=k===true?1:(k||0);const open=k>0;
  const W=2.3,H=1.25,D=1.6,Rr=D/2,t=TIERS[tier];const g=new THREE.Group();
  const map=woodTex(...t.wood);map.wrapS=map.wrapT=THREE.RepeatWrapping;map.repeat.set(.45,.8);
  const wood=new THREE.MeshStandardMaterial({map,roughness:t.wood[3]?.45:.75,envMapIntensity:.7});
  const met=new THREE.MeshStandardMaterial({color:t.metal,roughness:t.metalRough,metalness:1,envMapIntensity:1.4});
  const lock=new THREE.MeshStandardMaterial({color:t.lock,roughness:.15,metalness:1,envMapIntensity:1.6});
  const dark=new THREE.MeshStandardMaterial({color:0x1a0f2e,roughness:.8});
  const add=(geo,mat,x,y,z,p)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);(p||g).add(m);return m;};
  add(rbox(W,H,D,.12),wood,0,H/2,0);
  add(rbox(W+.08,.17,D+.08,.06),met,0,.085,0);add(rbox(W+.08,.17,D+.08,.06),met,0,H-.085,0);
  [-.72,.72].forEach(x=>add(rbox(.28,H+.02,D+.1,.07),met,x,H/2,0));
  [[-1,-1],[-1,1],[1,-1],[1,1]].forEach(([sx,sz])=>add(rbox(.2,H+.04,.2,.08),met,sx*(W/2-.02),H/2,sz*(D/2-.02)));
  add(rbox(.5,.56,.16,.1),lock,0,H-.3,D/2+.07);
  add(new THREE.CylinderGeometry(.065,.065,.05,20),dark,0,H-.25,D/2+.16).rotation.x=Math.PI/2;
  add(rbox(.07,.16,.05,.02),dark,0,H-.37,D/2+.155);
  if(t.gem){const gm=add(new THREE.OctahedronGeometry(.11,0),new THREE.MeshStandardMaterial({color:t.gem,emissive:t.gem,emissiveIntensity:.45,roughness:.1,metalness:.2}),0,H-.09,D/2+.14);gm.scale.set(1,1.25,.6);}
  const lid=new THREE.Group();lid.position.set(0,H,-D/2);g.add(lid);
  const dome=new THREE.CylinderGeometry(Rr,Rr,W,40,1,false,0,Math.PI);dome.rotateZ(Math.PI/2);add(dome,wood,0,0,Rr,lid);

  // Dessous du couvercle (visible une fois ouvert) : bois plus sombre.
  const under=add(new THREE.PlaneGeometry(W,D),new THREE.MeshStandardMaterial({map,color:0x9a8a80,roughness:.8,side:THREE.DoubleSide,envMapIntensity:.5}),0,.003,Rr,lid);under.rotation.x=Math.PI/2;
  [-.72,.72].forEach(x=>{const b=new THREE.CylinderGeometry(Rr+.045,Rr+.045,.28,40,1,false,0,Math.PI);b.rotateZ(Math.PI/2);add(b,met,x,0,Rr,lid);});
  [-1,1].forEach(sx=>{const c=new THREE.CylinderGeometry(Rr+.03,Rr+.03,.12,40,1,false,0,Math.PI);c.rotateZ(Math.PI/2);add(c,met,sx*(W/2-.02),0,Rr,lid);});
  add(rbox(W+.08,.14,.16,.05),met,0,.06,D+.01,lid);
  if(open){
    const e=1+2.7*Math.pow(k-1,3)+1.7*Math.pow(k-1,2); // easeOutBack : le couvercle dépasse un peu puis revient
    lid.rotation.x=-1.95*e;
    const glow=add(new THREE.PlaneGeometry(W-.3,D-.3),new THREE.MeshBasicMaterial({color:0xfff1b0,transparent:true,opacity:Math.min(1,k*1.4)}),0,H+.002,0);glow.rotation.x=-Math.PI/2;
    const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:canvasTex(128,128,(c,w,h)=>{const r=c.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);r.addColorStop(0,'rgba(255,236,150,.95)');r.addColorStop(1,'rgba(255,236,150,0)');c.fillStyle=r;c.fillRect(0,0,w,h);}),transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,opacity:k}));
    halo.position.set(0,H+.5,0);halo.scale.set(2.6*k,2*k,1);g.add(halo);
  }
  g.rotation.y=-.3;
  return {obj:g,cam:open?[0,2.9,7.2,0,1.25,0]:[0,2.6,6.6,0,.95,0]};
}
// Graines (repris de la maquette des objets)
function seeds(){const g=new THREE.Group();
  const prof=[];for(let i=0;i<=24;i++){const t=i/24;prof.push(new THREE.Vector2(Math.max(.001,.44*Math.pow(Math.sin(Math.PI*t),.85)*(1-.38*t)),t*1.15));}
  const lathe=new THREE.LatheGeometry(prof,48);lathe.translate(0,-.55,0);
  const mat=phys(0xE0A03A,{roughness:.28}),mat2=phys(0xC98A2B,{roughness:.3});
  const big=new THREE.Mesh(lathe,mat);g.add(big);
  const seam=new THREE.Mesh(new THREE.TorusGeometry(.43,.018,8,48,Math.PI),phys(0x9C6418));seam.scale.set(.98,1.25,1);seam.rotation.y=Math.PI/2;seam.position.y=-.05;big.add(seam);
  const s2=new THREE.Mesh(lathe,mat2);s2.scale.setScalar(.62);s2.position.set(-.62,-.22,-.25);s2.rotation.z=.7;g.add(s2);
  const s3=new THREE.Mesh(lathe,mat2);s3.scale.setScalar(.55);s3.position.set(.6,-.28,-.15);s3.rotation.z=-.8;g.add(s3);
  const green=phys(0x40C057,{roughness:.35});
  g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.QuadraticBezierCurve3(new THREE.Vector3(0,.58,0),new THREE.Vector3(.02,.82,0),new THREE.Vector3(.18,.95,0)),16,.035,8),green));
  const leaf=new THREE.SphereGeometry(.2,20,12);
  const l1=new THREE.Mesh(leaf,green);l1.scale.set(1,.22,.5);l1.position.set(.32,.98,0);l1.rotation.z=.35;g.add(l1);
  const l2=new THREE.Mesh(leaf,phys(0x51CF66));l2.scale.set(.75,.2,.42);l2.position.set(.02,1.0,0);l2.rotation.z=-.5;g.add(l2);
  g.position.y=-.2;return {obj:g,cam:[0,.4,4.6,0,0,0]};}
const flameShape=s=>{const f=new THREE.Shape();f.moveTo(0,.55*s);f.bezierCurveTo(.35*s,.2*s,.4*s,-.15*s,.25*s,-.35*s);f.bezierCurveTo(.12*s,-.5*s,-.12*s,-.5*s,-.25*s,-.35*s);f.bezierCurveTo(-.42*s,-.12*s,-.3*s,.1*s,-.12*s,.22*s);f.bezierCurveTo(-.08*s,.05*s,.02*s,.1*s,0,.55*s);return f;};
// Flamme de série : trois couches vernies, qui brillent un peu.
function flame(lit){const g=new THREE.Group();
  const c=lit?[0xFF6B00,0xFF922B,0xFFD43B]:[0x9E9AB4,0xB9B6C9,0xDAD8E6];
  const f1=new THREE.Mesh(extrude(flameShape(2.1),.36,.12),phys(c[0],{emissive:lit?0xFF4000:0,emissiveIntensity:.25}));g.add(f1);
  const f2=new THREE.Mesh(extrude(flameShape(1.45),.3,.1),phys(c[1],{emissive:lit?0xFF7A00:0,emissiveIntensity:.3}));f2.position.set(0,-.2,.2);g.add(f2);
  const f3=new THREE.Mesh(extrude(flameShape(.8),.24,.08),phys(c[2],{emissive:lit?0xFFC400:0,emissiveIntensity:.4}));f3.position.set(0,-.38,.38);g.add(f3);
  g.rotation.y=-.35;g.position.y=-.05;return {obj:g,cam:[0,.3,5.4,0,0,0]};}
function joker(){const g=new THREE.Group();
  const shield=s=>{const p=new THREE.Shape();p.moveTo(0,.78*s);p.bezierCurveTo(.3*s,.7*s,.55*s,.62*s,.7*s,.6*s);p.bezierCurveTo(.72*s,.1*s,.5*s,-.5*s,0,-.82*s);p.bezierCurveTo(-.5*s,-.5*s,-.72*s,.1*s,-.7*s,.6*s);p.bezierCurveTo(-.55*s,.62*s,-.3*s,.7*s,0,.78*s);return p;};
  g.add(new THREE.Mesh(extrude(shield(1.05),.12,.05),metal(0xFFC933,.2)));
  const inner=new THREE.Mesh(extrude(shield(.9),.14,.04),phys(0x6A4CFF,{roughness:.25}));inner.position.z=.04;g.add(inner);
  const f1=new THREE.Mesh(extrude(flameShape(1),.1,.04),phys(0xFF922B,{emissive:0xFF6B00,emissiveIntensity:.25}));f1.position.set(0,-.02,.18);g.add(f1);
  const f2=new THREE.Mesh(extrude(flameShape(.55),.08,.03),phys(0xFFD43B,{emissive:0xFFC400,emissiveIntensity:.35}));f2.position.set(0,-.12,.27);g.add(f2);
  g.rotation.y=-.3;return {obj:g,cam:[0,.2,4.4,0,0,0]};}
function ticket(base,light,ink,symbol){const g=new THREE.Group();const w=1.7,h=1.05,r=.12,n=.17;const s=new THREE.Shape();
  s.moveTo(-w/2+r,-h/2);s.lineTo(w/2-r,-h/2);s.quadraticCurveTo(w/2,-h/2,w/2,-h/2+r);s.lineTo(w/2,-n);s.absarc(w/2,0,n,-Math.PI/2,Math.PI/2,true);s.lineTo(w/2,h/2-r);
  s.quadraticCurveTo(w/2,h/2,w/2-r,h/2);s.lineTo(-w/2+r,h/2);s.quadraticCurveTo(-w/2,h/2,-w/2,h/2-r);s.lineTo(-w/2,n);s.absarc(-w/2,0,n,Math.PI/2,-Math.PI/2,true);s.lineTo(-w/2,-h/2+r);s.quadraticCurveTo(-w/2,-h/2,-w/2+r,-h/2);
  g.add(new THREE.Mesh(extrude(s,.12,.045),phys(base,{roughness:.35})));
  const face=canvasTex(512,316,(c,W,H)=>{c.fillStyle=light;c.beginPath();c.roundRect?c.roundRect(26,26,W-52,H-52,22):c.rect(26,26,W-52,H-52);c.fill();
    c.setLineDash([14,12]);c.lineWidth=6;c.strokeStyle=ink;c.globalAlpha=.55;c.beginPath();c.moveTo(W*.72,34);c.lineTo(W*.72,H-34);c.stroke();c.globalAlpha=1;c.setLineDash([]);
    symbol(c,W*.38,H/2);c.fillStyle='#fff';c.beginPath();c.arc(W*.86,H/2,26,0,Math.PI*2);c.fill();
    c.fillStyle=ink;c.font='900 34px Nunito, sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText('B',W*.86,H/2+2);});
  const decal=new THREE.Mesh(new THREE.PlaneGeometry(w-.02,h-.02),new THREE.MeshStandardMaterial({map:face,transparent:true,roughness:.45}));decal.position.z=.108;g.add(decal);
  g.rotation.set(-.15,-.35,-.12);return {obj:g,cam:[0,.2,4.1,0,0,0]};}
function can(){const g=new THREE.Group();const body=phys(0x12B886,{roughness:.25});const gold=metal(0xFFC933,.18);
  g.add(new THREE.Mesh(new THREE.CylinderGeometry(.48,.56,.8,48),body));
  const rt=new THREE.Mesh(new THREE.TorusGeometry(.48,.05,12,48),gold);rt.rotation.x=Math.PI/2;rt.position.y=.4;g.add(rt);
  const rb=new THREE.Mesh(new THREE.TorusGeometry(.56,.05,12,48),gold);rb.rotation.x=Math.PI/2;rb.position.y=-.4;g.add(rb);
  const top=new THREE.Mesh(new THREE.CircleGeometry(.47,40),phys(0x0CA678));top.rotation.x=-Math.PI/2;top.position.y=.401;g.add(top);
  g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([new THREE.Vector3(.4,-.2,0),new THREE.Vector3(.75,.05,0),new THREE.Vector3(1.0,.4,0),new THREE.Vector3(1.12,.58,0)]),32,.075,16),body));
  const rose=new THREE.Mesh(new THREE.CylinderGeometry(.2,.09,.2,32),gold);rose.position.set(1.18,.66,0);rose.rotation.z=-.9;g.add(rose);
  const handle=new THREE.Mesh(new THREE.TorusGeometry(.36,.06,12,32,Math.PI*1.15),gold);handle.position.set(-.5,.12,0);handle.rotation.z=Math.PI/2-.3;g.add(handle);
  g.position.set(-.3,-.05,0);g.rotation.y=-.3;return {obj:g,cam:[0,.5,4.6,0,0,0]};}

const T50=()=>ticket(0x2F8CE8,'#8FCBFF','#0B3C7A',(c,x,y)=>{c.fillStyle='#0B3C7A';c.font='900 150px Nunito, sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText('½',x,y+8);});
const THINT=()=>ticket(0xF2A900,'#FFE27A','#7A4A00',(c,x,y)=>{c.fillStyle='#fff';c.beginPath();c.arc(x,y-22,58,Math.PI*.8,Math.PI*2.2);c.lineTo(x+30,y+46);c.lineTo(x-30,y+46);c.closePath();c.fill();
  c.fillStyle='#1E1340';c.fillRect(x-30,y+54,60,14);c.fillRect(x-22,y+74,44,12);c.strokeStyle='#E0A300';c.lineWidth=8;c.lineCap='round';c.beginPath();c.moveTo(x-16,y-8);c.lineTo(x,y+16);c.lineTo(x+16,y-8);c.stroke();});

function snap(build,px,frameBuild,restBuild){
  R.setSize(px,px,false);
  while(holder.children.length) holder.remove(holder.children[0]);
  const built=build();const {obj,cam:c}=built;holder.add(obj);R.toneMappingExposure=built.exposure||1.25;
  linear(obj);
  // cadrage automatique : l'objet remplit l'image avec une petite marge
  cam.position.set(c[0],c[1],c[2]);cam.lookAt(c[3],c[4],c[5]);cam.updateMatrixWorld();
  // Cadrage : celui de l'objet, ou d'un autre état (ex. coffre ouvert) pour qu'une animation ne bouge pas.
  // Avec frameBuild (images d'une animation) : centré sur l'objet au repos, taille de l'état le plus grand (sans la lueur),
  // pour que l'objet reste au centre et ne bouge pas d'une image à l'autre.
  let ctr,sz;
  if(frameBuild){
    const rest=(restBuild||build)().obj;rest.updateMatrixWorld(true);ctr=new THREE.Box3().setFromObject(rest).getCenter(new THREE.Vector3());
    const big=frameBuild().obj;big.updateMatrixWorld(true);const bb=new THREE.Box3();
    big.traverse(o=>{if(o.isMesh)bb.expandByObject(o);});sz=bb.getSize(new THREE.Vector3());
  }else{const box=new THREE.Box3().setFromObject(obj);ctr=box.getCenter(new THREE.Vector3());sz=box.getSize(new THREE.Vector3());}
  const rad=Math.max(sz.x,sz.y,sz.z)*.62;const dist=rad/Math.tan(THREE.MathUtils.degToRad(15));
  const dir=new THREE.Vector3(c[0]-c[3],c[1]-c[4],c[2]-c[5]).normalize();
  cam.position.copy(ctr).addScaledVector(dir,dist);cam.lookAt(ctr);
  // Centrage horizontal à l'image près : l'objet au repos est mesuré, puis toute l'animation est décalée d'autant.
  let rest=obj;
  if(frameBuild){holder.remove(obj);rest=(restBuild||build)().obj;linear(rest);holder.add(rest);}
  R.render(scene,cam);const dx=px/2-alphaCenterX(px);
  if(rest!==obj){holder.remove(rest);holder.add(obj);}
  cam.setViewOffset(px,px,-dx,0,px,px);
  R.render(scene,cam);const url=R.domElement.toDataURL('image/png');
  cam.clearViewOffset();return url;
}
// Couleurs données en sRGB : on les passe en linéaire pour garder leur vrai ton.
function linear(obj){obj.traverse(o=>{const m=o.material;if(!m||m.userData.lin||m.isSpriteMaterial)return;m.userData.lin=true;if(m.color&&!m.map)m.color.convertSRGBToLinear();if(m.emissive)m.emissive.convertSRGBToLinear();});}
// Milieu horizontal de ce qui est dessiné (pixels assez opaques).
function alphaCenterX(px){const c=document.createElement('canvas');c.width=c.height=px;const g=c.getContext('2d');g.drawImage(R.domElement,0,0);
  const d=g.getImageData(0,0,px,px).data;let min=px,max=-1;
  for(let y=0;y<px;y+=2)for(let x=0;x<px;x++){if(d[(y*px+x)*4+3]>40){if(x<min)min=x;if(x>max)max=x;}}
  return max<0?px/2:(min+max+1)/2;}

// Emblèmes de rang, médailles et coupe (repris de la maquette « rangs 3D » validée).
  const RANKS = [
    { name: 'Curieux',      elo: 'Moins de 600',  rim: 0xB87333, enamel: 0x8B4A2B, marks: 1 },
    { name: 'Amateur',      elo: 'À partir de 600',  rim: 0xC9773A, enamel: 0x2F9E44, marks: 2 },
    { name: 'Éclairé',      elo: 'À partir de 750',  rim: 0xDDE3EA, enamel: 0x1C7ED6, marks: 3, laurel: true },
    { name: 'Érudit',       elo: 'À partir de 900',  rim: 0xFFC933, enamel: 0x6A4CFF, marks: 4, laurel: true },
    { name: 'Expert',       elo: 'À partir de 1 050', rim: 0xFFC933, enamel: 0xC2255C, marks: 4, laurel: true, wings: true },
    { name: 'Encyclopédie', elo: 'À partir de 1 200', rim: 0xFFC933, enamel: 0x24127A, marks: 5, laurel: true, wings: true, crown: true, gem: true },
  ];
  function rrect(w, h, r) { const s = new THREE.Shape(); s.moveTo(-w / 2 + r, -h / 2); s.lineTo(w / 2 - r, -h / 2); s.quadraticCurveTo(w / 2, -h / 2, w / 2, -h / 2 + r); s.lineTo(w / 2, h / 2 - r); s.quadraticCurveTo(w / 2, h / 2, w / 2 - r, h / 2); s.lineTo(-w / 2 + r, h / 2); s.quadraticCurveTo(-w / 2, h / 2, -w / 2, h / 2 - r); s.lineTo(-w / 2, -h / 2 + r); s.quadraticCurveTo(-w / 2, -h / 2, -w / 2 + r, -h / 2); return s; }
  const circle = (r) => { const s = new THREE.Shape(); s.absarc(0, 0, r, 0, Math.PI * 2, false); return s; };
  const polygon = (n, r, rot) => { const s = new THREE.Shape(); for (let i = 0; i <= n; i++) { const a = rot + i / n * Math.PI * 2; i ? s.lineTo(Math.cos(a) * r, Math.sin(a) * r) : s.moveTo(Math.cos(a) * r, Math.sin(a) * r); } return s; };
  const shield = (k) => { const p = new THREE.Shape(); p.moveTo(0, .8 * k); p.bezierCurveTo(.32 * k, .72 * k, .58 * k, .66 * k, .74 * k, .62 * k); p.bezierCurveTo(.76 * k, .08 * k, .52 * k, -.52 * k, 0, -.86 * k); p.bezierCurveTo(-.52 * k, -.52 * k, -.76 * k, .08 * k, -.74 * k, .62 * k); p.bezierCurveTo(-.58 * k, .66 * k, -.32 * k, .72 * k, 0, .8 * k); return p; };
  const star = (n, R, r) => { const s = new THREE.Shape(); for (let i = 0; i <= 2 * n; i++) { const a = Math.PI / 2 + i / (2 * n) * Math.PI * 2, rr = i % 2 ? r : R; i ? s.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : s.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); } return s; };

  // Les traits du 5 du jour, en relief.
  function tally(n, mat, slashMat) {
    const g = new THREE.Group(); const count = Math.min(n, 4); const gap = .17;
    for (let i = 0; i < count; i++) { const m = new THREE.Mesh(extrude(rrect(.09, .52, .045), .06, .025), mat); m.position.x = (i - (count - 1) / 2) * gap; g.add(m); }
    if (n >= 5) { const s = new THREE.Mesh(extrude(rrect(.09, .78, .045), .06, .025), slashMat); s.rotation.z = -1.05; s.position.z = .05; g.add(s); }
    return g;
  }
  function laurel(mat) {
    const g = new THREE.Group(); const leaf = new THREE.SphereGeometry(.09, 14, 10);
    [-1, 1].forEach((side) => { for (let i = 0; i < 6; i++) { const a = -Math.PI / 2 + .35 + i * .36; const m = new THREE.Mesh(leaf, mat); m.scale.set(.55, 1.25, .35); m.position.set(side * Math.cos(a) * .98, Math.sin(a) * .98 - .02, .02); m.rotation.z = side * (a + Math.PI / 2) * -1 + (side > 0 ? 0 : 0); m.rotation.z = Math.atan2(Math.sin(a), Math.cos(a)) * (side > 0 ? 1 : -1) + (side > 0 ? 0 : Math.PI); g.add(m); } });
    return g;
  }
  function wing(side, mat) {
    const s = new THREE.Shape(); s.moveTo(0, .25); s.bezierCurveTo(.35, .55, .75, .6, 1.05, .52); s.bezierCurveTo(.92, .4, .95, .3, .82, .22); s.bezierCurveTo(.9, .12, .85, .02, .72, -.02);
    s.bezierCurveTo(.78, -.12, .7, -.2, .58, -.2); s.bezierCurveTo(.4, -.2, .2, -.15, 0, -.1); s.lineTo(0, .25);
    const m = new THREE.Mesh(extrude(s, .05, .03), mat); m.scale.x = side; m.position.set(side * .62, .12, -.08); return m;
  }
  function crown(mat, gemMat) {
    const s = new THREE.Shape(); s.moveTo(-.42, 0); s.lineTo(-.48, .36); s.lineTo(-.24, .18); s.lineTo(0, .44); s.lineTo(.24, .18); s.lineTo(.48, .36); s.lineTo(.42, 0); s.lineTo(-.42, 0);
    const g = new THREE.Group(); g.add(new THREE.Mesh(extrude(s, .1, .04), mat));
    [-.48, 0, .48].forEach((x, i) => { const b = new THREE.Mesh(new THREE.SphereGeometry(.065, 16, 12), gemMat); b.position.set(x, [.38, .47, .38][i], .03); g.add(b); });
    return g;
  }

  function emblem(rank, idx) {
    const g = new THREE.Group(); const rim = metal(rank.rim, rank.rim === 0xDDE3EA ? .12 : .2); const enamel = phys(rank.enamel);
    const white = phys(0xffffff, { roughness: .3 }); const gold = metal(0xFFC933, .16);
    let outer, inner;
    if (idx === 0) { outer = circle(.86); inner = circle(.72); }
    else if (idx === 1) { outer = shield(1.05); inner = shield(.88); }
    else if (idx === 2) { outer = polygon(6, .9, Math.PI / 2); inner = polygon(6, .75, Math.PI / 2); }
    else if (idx === 3) { outer = polygon(8, .92, Math.PI / 8); inner = polygon(8, .77, Math.PI / 8); }
    else if (idx === 4) { outer = shield(1.12); inner = shield(.94); }
    else { outer = star(8, 1.0, .84); inner = circle(.7); }
    g.add(new THREE.Mesh(extrude(outer, .16, .06), rim));
    const enam = new THREE.Mesh(extrude(inner, .14, .04), enamel); enam.position.z = .06; g.add(enam);
    if (rank.laurel) { const l = laurel(gold); l.position.z = .02; l.scale.setScalar(idx === 5 ? 1.12 : 1.02); g.add(l); }
    if (rank.wings) { g.add(wing(1, metal(0xffffff, .25))); g.add(wing(-1, metal(0xffffff, .25))); }
    const t = tally(rank.marks, idx >= 3 ? gold : white, metal(0xFFD23F, .12)); t.position.set(0, idx === 1 || idx === 4 ? .02 : 0, .2); g.add(t);
    if (rank.crown) { const c = crown(gold, phys(0xff4d5e, { emissive: 0xff2040, emissiveIntensity: .25 })); c.position.set(0, .9, 0); g.add(c); }
    if (rank.gem) {
      const gm = new THREE.Mesh(new THREE.OctahedronGeometry(.13, 0), phys(0x74C0FC, { emissive: 0x4dabf7, emissiveIntensity: .5, roughness: .05 }));
      gm.position.set(0, -.78, .15); gm.scale.set(1, 1.3, .7); g.add(gm); g.userData.gem = gm;
      const ring = new THREE.Mesh(new THREE.TorusGeometry(1.18, .025, 8, 80), metal(0xFFE680, .1)); ring.rotation.x = 1.25; g.add(ring); g.userData.ring = ring;
    }
    return g;
  }
  function medal(m) {
    const g = new THREE.Group(); const mat = m.diamond ? phys(m.metal, { roughness: .04, clearcoat: 1, metalness: .3, envMapIntensity: 1.8 }) : metal(m.metal, .2);
    const ribbonA = phys(0x6A4CFF, { clearcoat: .3, roughness: .5 }), ribbonB = phys(0xFFD23F, { clearcoat: .3, roughness: .5 });
    const tail = (side, mat2) => { const s = new THREE.Shape(); s.moveTo(-.16, 0); s.lineTo(.16, 0); s.lineTo(.2, -.62); s.lineTo(0, -.5); s.lineTo(-.2, -.62); s.lineTo(-.16, 0);
      const r = new THREE.Mesh(extrude(s, .03, .015), mat2); r.position.set(side * .22, -.55, -.12); r.rotation.z = side * .32; return r; };
    g.add(tail(-1, ribbonA)); g.add(tail(1, ribbonB));
    const disc = new THREE.Mesh(extrude(circle(.72), .14, .06), mat); g.add(disc);
    const inner = new THREE.Mesh(extrude(circle(.56), .06, .03), m.diamond ? phys(0x1C7ED6, { roughness: .1 }) : phys(0x2B1B66, { roughness: .35 })); inner.position.z = .09; g.add(inner);
    // Globe en relief (domaine Géographie)
    const globeMat = m.diamond ? metal(0xffffff, .05) : mat;
    const ring = (r, rx, ry) => { const t = new THREE.Mesh(new THREE.TorusGeometry(r, .025, 8, 48), globeMat); t.rotation.set(rx, ry, 0); t.position.z = .16; g.add(t); };
    ring(.36, 0, 0); ring(.36, 0, Math.PI / 2 - .5); ring(.36, 0, -(Math.PI / 2 - .5)); ring(.36, Math.PI / 2, 0);
    const lat = new THREE.Mesh(new THREE.TorusGeometry(.28, .022, 8, 48), globeMat); lat.position.set(0, .2, .16); lat.scale.y = .3; g.add(lat);
    const lat2 = lat.clone(); lat2.position.y = -.2; g.add(lat2);
    if (m.diamond) { const d = new THREE.Mesh(new THREE.OctahedronGeometry(.12, 0), phys(0xffffff, { roughness: 0, emissive: 0x9be7ff, emissiveIntensity: .4 })); d.position.set(0, .82, .05); d.scale.set(1, 1.3, .7); g.add(d); }
    g.position.y = .18; return g;
  }
  function cup() {
    const g = new THREE.Group(); const gold = metal(0xFFC933, .16);
    const prof = [[0, -.9], [.42, -.9], [.42, -.8], [.16, -.72], [.1, -.5], [.12, -.3], [.3, -.2], [.5, .05], [.58, .45], [.6, .62], [.56, .62], [.52, .45], [.44, .1], [0, 0]].map(([x, y]) => new THREE.Vector2(x, y));
    g.add(new THREE.Mesh(new THREE.LatheGeometry(prof, 56), gold));
    [-1, 1].forEach((s) => { const h = new THREE.Mesh(new THREE.TorusGeometry(.22, .045, 12, 32, Math.PI * 1.2), gold); h.position.set(s * .6, .3, 0); h.rotation.z = s > 0 ? -Math.PI / 2 - .3 : Math.PI / 2 + .3; g.add(h); });
    const plaque = new THREE.Mesh(extrude(rrect(.5, .16, .05), .03, .015), phys(0x6A4CFF)); plaque.position.set(0, -.82, .44); g.add(plaque);
    const flame = (k) => { const f = new THREE.Shape(); f.moveTo(0, .55 * k); f.bezierCurveTo(.35 * k, .2 * k, .4 * k, -.15 * k, .25 * k, -.35 * k); f.bezierCurveTo(.12 * k, -.5 * k, -.12 * k, -.5 * k, -.25 * k, -.35 * k); f.bezierCurveTo(-.42 * k, -.12 * k, -.3 * k, .1 * k, -.12 * k, .22 * k); f.bezierCurveTo(-.08 * k, .05 * k, .02 * k, .1 * k, 0, .55 * k); return f; };
    const fl = new THREE.Mesh(extrude(flame(.55), .06, .03), phys(0xFF922B, { emissive: 0xff6b00, emissiveIntensity: .3 })); fl.position.set(0, .25, .5); g.add(fl);
    g.position.y = .1; return g;
  }

// Emblèmes de rang v2 : la matière monte avec le rang (cuivre, bronze, argent, or, platine, cristal), les traits du
// 5 du jour (1 à 5), des étoiles au-dessus (Éclairé 1, Érudit 2, Expert et Encyclopédie 3) et un ruban au nom du rang.
const RANKS2=[
  {name:'CURIEUX',rim:0xB87333,rough:.35,enamel:0x8B4A2B,ribbon:0x8B4A2B,marks:1,stars:0,shape:'circle'},
  {name:'AMATEUR',rim:0xCD8A45,rough:.28,enamel:0x2F9E44,ribbon:0x2B8A3E,marks:2,stars:0,shape:'shield'},
  {name:'ÉCLAIRÉ',rim:0xE4EAF2,rough:.14,enamel:0x1C7ED6,ribbon:0x1971C2,marks:3,stars:1,shape:'hex'},
  {name:'ÉRUDIT',rim:0xFFC933,rough:.16,enamel:0x6A4CFF,ribbon:0x5F3DC4,marks:4,stars:2,shape:'oct',laurel:true},
  {name:'EXPERT',rim:0xCFE3FF,rough:.1,enamel:0xC2255C,ribbon:0xA61E4D,marks:5,stars:3,shape:'shield',laurel:true,wings:true},
  {name:'ENCYCLOPÉDIE',rim:0xFFC933,rough:.1,enamel:0x24127A,ribbon:0x24127A,marks:5,stars:3,shape:'star',laurel:true,wings:true,crown:true},
];
function ribbonMesh(text,color){
  const g=new THREE.Group();const w=1.9,h=.36;
  const sh=new THREE.Shape();sh.moveTo(-w/2,-h/2);sh.lineTo(w/2,-h/2);sh.lineTo(w/2-.12,0);sh.lineTo(w/2,h/2);sh.lineTo(-w/2,h/2);sh.lineTo(-w/2+.12,0);sh.lineTo(-w/2,-h/2);
  g.add(new THREE.Mesh(extrude(sh,.05,.02),phys(color,{roughness:.45})));
  const tex=canvasTex(512,96,(c,W,H)=>{c.clearRect(0,0,W,H);c.fillStyle='#fff';c.textAlign='center';c.textBaseline='middle';
    let size=68;c.font=`900 ${size}px Nunito, Arial Black, sans-serif`;while(c.measureText(text).width>W*.86&&size>20){size-=2;c.font=`900 ${size}px Nunito, Arial Black, sans-serif`;}
    c.fillStyle='rgba(0,0,0,.25)';c.fillText(text,W/2,H*.6+3);c.fillStyle='#fff';c.fillText(text,W/2,H*.6);});
  const label=new THREE.Mesh(new THREE.PlaneGeometry(w*.86,h*.86),new THREE.MeshBasicMaterial({map:tex,transparent:true}));label.position.z=.075;label.renderOrder=2;label.material.depthTest=false;g.add(label);
  return g;}
function emblem2(idx,core){
  const r=Object.assign({},RANKS2[idx],core?{wings:false,crown:false,stars:0,ribbon:null}:{});const g=new THREE.Group();
  const rim=metal(r.rim,r.rough);const enamel=phys(r.enamel,{roughness:.22});const gold=metal(0xFFC933,.15);const white=phys(0xffffff,{roughness:.3});
  let outer,inner;
  if(r.shape==='circle'){outer=circle(.86);inner=circle(.7);}
  else if(r.shape==='shield'){outer=shield(idx===4?1.12:1.05);inner=shield(idx===4?.94:.88);}
  else if(r.shape==='hex'){outer=polygon(6,.92,Math.PI/2);inner=polygon(6,.76,Math.PI/2);}
  else if(r.shape==='oct'){outer=polygon(8,.94,Math.PI/8);inner=polygon(8,.78,Math.PI/8);}
  else {outer=star(8,1.02,.86);inner=circle(.7);}
  g.add(new THREE.Mesh(extrude(outer,.18,.07),rim));
  const en=new THREE.Mesh(extrude(inner,.14,.04),enamel);en.position.z=.08;g.add(en);
  if(r.laurel){const l=laurel(gold);l.position.z=.02;l.scale.setScalar(idx===5?1.14:1.04);g.add(l);}
  if(r.wings){const wm=metal(idx===5?0xFFE680:0xEAF2FF,.18);g.add(wing(1,wm));g.add(wing(-1,wm));}
  // Traits : 1 à 4 verticaux, le 5e barre en or.
  const t=tally(r.marks,idx>=3?gold:white,metal(0xFFD23F,.1));t.position.set(0,r.shape==='shield'?.04:.02,.22);t.scale.setScalar(1.1);g.add(t);
  // Étoiles au-dessus.
  const starMat=metal(0xFFD23F,.12);
  for(let i=0;i<r.stars;i++){const m=new THREE.Mesh(extrude(star(5,.15,.065),.05,.02),starMat);const x=(i-(r.stars-1)/2)*.32;m.position.set(x,(r.crown?1.32:1.06)-Math.abs(x)*.25,.05);m.rotation.z=-x*.4;g.add(m);}
  if(r.crown){const c=crown(gold,phys(0xff4d5e,{emissive:0xff2040,emissiveIntensity:.25}));c.position.set(0,.92,0);g.add(c);
    const gem=new THREE.Mesh(new THREE.OctahedronGeometry(.14,0),phys(0x74C0FC,{emissive:0x4dabf7,emissiveIntensity:.5,roughness:.05}));gem.position.set(0,-.55,.26);gem.scale.set(1,1.3,.7);g.add(gem);
    const ring=new THREE.Mesh(new THREE.TorusGeometry(1.2,.028,8,80),metal(0xFFE680,.1));ring.rotation.x=1.3;g.add(ring);}
  // Ruban au nom du rang.
  if(core)return g;
  const rb=ribbonMesh(r.name,r.ribbon);rb.position.set(0,-.98,.3);rb.rotation.x=-.12;g.add(rb);
  return g;}

function framed(obj,c){return {obj,cam:c||[0,.2,5.2,0,.05,0]};}

// Sac : besace en cuir violet, rabat arrondi, boucle et coutures dorées, graines qui dépassent, anse.
function bag(){const g=new THREE.Group();
  const leather=phys(0x7B5CFF,{roughness:.5});const leatherDark=phys(0x4B2BC9,{roughness:.55});const gold=metal(0xFFC933,.2);
  // corps
  const body=new THREE.Mesh(rbox(1.8,1.3,.9,.3),leather);body.position.y=-.15;g.add(body);
  // graines qui dépassent du sac
  const prof=[];for(let i=0;i<=20;i++){const t=i/20;prof.push(new THREE.Vector2(Math.max(.001,.44*Math.pow(Math.sin(Math.PI*t),.85)*(1-.38*t)),t*1.15));}
  const lathe=new THREE.LatheGeometry(prof,32);lathe.translate(0,-.55,0);
  [[-.38,.72,.02,.55,.45],[.04,.86,-.05,.62,-.08],[.44,.7,.06,.5,-.5]].forEach(([x,y,z,sc,rz])=>{const m=new THREE.Mesh(lathe,phys(0xE0A03A,{roughness:.3}));m.scale.setScalar(sc);m.position.set(x,y,z);m.rotation.z=rz;g.add(m);});
  const stem=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,.2,8),phys(0x40C057));stem.position.set(.06,1.28,-.05);g.add(stem);
  const leaf=new THREE.Mesh(new THREE.SphereGeometry(.15,16,10),phys(0x51CF66));leaf.scale.set(1,.25,.5);leaf.position.set(.17,1.38,-.05);leaf.rotation.z=.4;g.add(leaf);
  // rabat court qui retombe sur le haut du devant
  const flapShape=new THREE.Shape();flapShape.moveTo(-.88,0);flapShape.lineTo(.88,0);flapShape.lineTo(.88,-.25);flapShape.quadraticCurveTo(.88,-.58,0,-.62);flapShape.quadraticCurveTo(-.88,-.58,-.88,-.25);flapShape.lineTo(-.88,0);
  const flap=new THREE.Mesh(extrude(flapShape,.1,.05),leatherDark);flap.position.set(0,.5,.47);g.add(flap);
  // couture dorée du rabat
  const seam=new THREE.Mesh(new THREE.TorusGeometry(.68,.02,8,48,Math.PI),gold);seam.rotation.z=Math.PI;seam.scale.set(1,.62,1);seam.position.set(0,.36,.57);g.add(seam);
  // boucle dorée au bas du rabat
  const buckle=new THREE.Mesh(rbox(.36,.3,.1,.07),gold);buckle.position.set(0,-.1,.6);g.add(buckle);
  const hole=new THREE.Mesh(rbox(.18,.12,.05,.03),new THREE.MeshStandardMaterial({color:0x1a0f2e,roughness:.8}));hole.position.set(0,-.1,.66);g.add(hole);
  // couture du bas
  const line=new THREE.Mesh(rbox(1.5,.03,.02,.01),gold);line.position.set(0,-.62,.46);g.add(line);
  // anse
  const handle=new THREE.Mesh(new THREE.TorusGeometry(.62,.07,14,40,Math.PI),leatherDark);handle.position.set(0,.5,-.25);g.add(handle);
  [-.62,.62].forEach(x=>{const r=new THREE.Mesh(new THREE.CylinderGeometry(.1,.1,.06,20),gold);r.rotation.x=Math.PI/2;r.position.set(x,.5,-.2);g.add(r);});
  g.rotation.set(.18,-.35,0);return {obj:g,cam:[0,.5,5,0,0,0]};}

// Nom de l'image dans l'app → [modèle, taille en pixels (@3x)].
const ICONS={
  chest_wood:[()=>chest('wood',false),600], chest_silver:[()=>chest('silver',false),600],
  chest_gold:[()=>chest('gold',false),600], chest_savant:[()=>chest('savant',false),600],
  chest_wood_open:[()=>chest('wood',true),600], chest_silver_open:[()=>chest('silver',true),600],
  chest_gold_open:[()=>chest('gold',true),600], chest_savant_open:[()=>chest('savant',true),600],
  seeds:[seeds,192], flame:[()=>flame(true),192], flame_off:[()=>flame(false),192], joker:[joker,192],
  ticket_fifty:[T50,192], ticket_hint:[THINT,192], watering_can:[can,192],
};
// Ouverture du coffre, image par image (écran d'ouverture) : 10 images de fermé à ouvert, même cadrage.
const FRAMES=10;
for(const tier of ['wood','silver','gold','savant']) for(let i=0;i<FRAMES;i++)
  ICONS[`ChestOpening/chest_${tier}_${i}`]=[()=>chest(tier,Math.pow(i/(FRAMES-1),1.6)),540,()=>chest(tier,1),()=>chest(tier,0)];
// Rangs (même ordre que CoteCULT.Rank), trophée d'exploit. Même cadre pour les six : la taille des ornements dit le rang.
const rankFrame=()=>({obj:new THREE.Mesh(new THREE.BoxGeometry(2.7,2.7,.4))});
['curious','amateur','enlightened','scholar','expert','encyclopedia'].forEach((id,i)=>{ICONS[`rank_${id}`]=[()=>Object.assign(framed(emblem2(i)),{exposure:.95}),540,rankFrame,()=>framed(emblem2(i,true))];});
ICONS.bag=[bag,192];
// Médailles de maîtrise d'un domaine (globe en relief).
[['bronze',0xC77B3A,false],['silver',0xE4EAF2,false],['gold',0xFFC933,false],['diamond',0x9BE7FF,true]].forEach(([id,c,d])=>{ICONS[`medal_${id}`]=[()=>framed(medal({metal:c,diamond:d})),360];});
ICONS.trophy_cup=[()=>framed(cup()),360];
window.renderIcons=()=>{const out={};for(const [name,[build,px,frame,rest]] of Object.entries(ICONS)) out[name]=snap(build,px,frame,rest);return out;};
</script>
