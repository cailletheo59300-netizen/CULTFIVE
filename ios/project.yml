    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.brainlix.ios
        # Requis par le SDK Google Mobile Ads.
        OTHER_LDFLAGS: "$(inherited) -ObjC"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(BRAINLIX_TEAM_ID)
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Release:
          # Le mode démo (données enregistrées) n'existe que dans les builds Debug.
          EXCLUDED_SOURCE_FILE_NAMES: "*.demo.json DemoGameService.swift DemoPlayEngine.swift DemoDuelEngine.swift"
  CultFiveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CultFiveTests
    dependencies:
      - target: CultFive
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CultFive:
    build:
      targets:
        CultFive: all
        CultFiveTests: [test]
    test:
      targets:
        - CultFiveTests
      gatherCoverageData: true
