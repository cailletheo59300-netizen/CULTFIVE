# Projet Xcode généré par XcodeGen : `brew install xcodegen && cd ios && xcodegen`.
# Le .xcodeproj n'est pas versionné (diffs lisibles, pas de conflits).
name: CultFive
options:
  bundleIdPrefix: app.brainlix
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.4.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
packages:
  CultFiveCore:
    path: Packages/CultFiveCore
  # Pubs Google AdMob et consentement RGPD (UMP). Versions majeures figées : l'API Swift change entre majeures.
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    majorVersion: 13.0.0
  # Médiation AdMob : Unity Ads participe aux enchères (D-064). L'adaptateur fixe la version du SDK Unity.
  GoogleMobileAdsMediationUnity:
    url: https://github.com/googleads/googleads-mobile-ios-mediation-unity
    majorVersion: 4.21.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    majorVersion: 2.1.0
targets:
  CultFive:
    type: application
    platform: iOS
    sources:
      - path: CultFive
        excludes: ["Resources/PrivacyInfo.xcprivacy"]
      # Déclaration de confidentialité Apple : copiée telle quelle dans l'app.
      - path: CultFive/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      # Album : cartes, dessins, pochettes, dos et icônes du pass, générés par scripts/album/export-app*.
      - path: AlbumData
        type: folder
        buildPhase: resources
    dependencies:
      - package: CultFiveCore
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleMobileAdsMediationUnity
        product: UnityAdapterTarget
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    entitlements:
      path: CultFive/CultFive.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.developer.associated-domains: ["applinks:brainlix.site"]
        # Notifications push (duels, amis, ligues). La signature passe en « production » à l'export App Store / TestFlight.
        aps-environment: development
    info:
      path: CultFive/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: Paper
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        CFBundleURLTypes:
          - CFBundleURLName: app.brainlix.ios
            CFBundleURLSchemes: [brainlix]
        # AdMob : identifiant de l'app (public), demande de suivi Apple, réseaux publicitaires (listes Google et Unity).
        GADApplicationIdentifier: ca-app-pub-1190519561086839~7599268856
        NSUserTrackingUsageDescription: "Brainlix affiche des pubs pour rester gratuit. Si tu acceptes, elles seront plus adaptées à tes goûts ; sinon, tu verras simplement des pubs moins ciblées."
