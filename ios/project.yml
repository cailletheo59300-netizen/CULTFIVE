# Projet Xcode généré par XcodeGen : `brew install xcodegen && cd ios && xcodegen`.
# Le .xcodeproj n'est pas versionné (diffs lisibles, pas de conflits).
name: CultFive
options:
  bundleIdPrefix: app.cultfive
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
packages:
  CultFiveCore:
    path: Packages/CultFiveCore
targets:
  CultFive:
    type: application
    platform: iOS
    sources:
      - path: CultFive
    dependencies:
      - package: CultFiveCore
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    entitlements:
      path: CultFive/CultFive.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.developer.associated-domains: ["applinks:cultfive.app"]
    info:
      path: CultFive/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUPABASE_URL: $(SUPABASE_URL)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: Paper
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSupportsIndirectInputEvents: true
        CFBundleURLTypes:
          - CFBundleURLName: app.cultfive.ios
            CFBundleURLSchemes: [cultfive]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.cultfive.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(CULTFIVE_TEAM_ID)
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Release:
          # Le mode démo (données enregistrées) n'existe que dans les builds Debug.
          EXCLUDED_SOURCE_FILE_NAMES: "*.demo.json DemoGameService.swift"
  CultFiveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CultFiveTests
    dependencies:
      - target: CultFive
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CultFive:
    build:
      targets:
        CultFive: all
        CultFiveTests: [test]
    test:
      targets:
        - CultFiveTests
      gatherCoverageData: true
