# Projet Xcode de Lumiligne, généré par XcodeGen : `brew install xcodegen && cd lumiligne && xcodegen`.
# Le .xcodeproj n'est pas versionné (diffs lisibles, pas de conflits).
name: Lumiligne
options:
  bundleIdPrefix: app.brainlix
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
packages:
  LumiCore:
    path: Packages/LumiCore
  # Pubs Google AdMob et consentement RGPD (UMP), mêmes versions majeures que Brainlix.
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    majorVersion: 13.0.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    majorVersion: 2.1.0
targets:
  Lumiligne:
    type: application
    platform: iOS
    sources:
      - path: Lumiligne
        excludes: ["Resources/PrivacyInfo.xcprivacy"]
      # Déclaration de confidentialité Apple : copiée telle quelle dans l'app.
      - path: Lumiligne/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: LumiCore
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    entitlements:
      path: Lumiligne/Lumiligne.entitlements
      properties:
        # Classements Game Center (niveau atteint et grille du jour).
        com.apple.developer.game-center: true
    info:
      path: Lumiligne/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIStatusBarHidden: false
        UIApplicationSupportsIndirectInputEvents: true
        # AdMob : identifiant de l'app (public, réglé dans Config/App.xcconfig), demande de suivi Apple, réseaux publicitaires.
        GADApplicationIdentifier: $(ADMOB_APP_ID)
        NSUserTrackingUsageDescription: "Lumiligne affiche des pubs pour rester gratuit. Si tu acceptes, elles seront plus adaptées à tes goûts ; sinon, tu verras simplement des pubs moins ciblées."
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
